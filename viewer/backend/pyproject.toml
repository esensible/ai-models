[project]
name = "viewer-backend"
version = "0.1.0"
description = "Lambda handlers for the 3MF viewer: S3->DynamoDB indexer + WebSocket directory service."
requires-python = ">=3.12"
# boto3 is provided by the Lambda runtime; pinned here for local dev/test + bundling parity.
dependencies = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "boto3-stubs[dynamodb,s3,apigatewaymanagementapi]>=1.34",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
